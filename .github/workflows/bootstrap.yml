name: Bootstrap and deploy COMB

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Expand and commit the authored source
        run: |
          unzip -q comb-source.zip
          git rm -- comb-source.zip .github/workflows/bootstrap.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish COMB source for GitHub Pages'
          git push
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --ignore-pattern out
      - run: node --experimental-strip-types --test tests/core.test.mjs
      - run: pnpm exec next build --webpack
        env:
          GITHUB_PAGES: '1'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
